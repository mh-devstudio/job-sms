<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>তথ্য ব্যবস্থাপনা সফটওয়্যার</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .app-container {
      width: 100%;
      max-width: 500px;
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    h2, h3 {
      text-align: center;
      color: #333;
      margin-bottom: 15px;
    }
    .section {
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
    }
    input, select, textarea, button {
      width: 100%;
      padding: 10px 15px;
      font-size: 15px;
      border: 2px solid #ddd;
      border-radius: 8px;
      outline: none;
      margin-bottom: 10px;
      background-color: #fff;
    }
    textarea {
      resize: vertical;
      height: 80px;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #4CAF50;
    }
    .file-upload-label {
      display: block;
      font-size: 14px;
      color: #555;
      margin-bottom: 5px;
      font-weight: bold;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      padding: 12px;
      border-radius: 8px;
    }
    button:hover {
      background-color: #45a049;
    }
    .result-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: #fdfdfd;
      border-left: 5px solid #4CAF50;
      padding: 15px;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      position: relative;
    }
    .card h3 {
      text-align: left;
      color: #2c3e50;
      margin-bottom: 5px;
    }
    .card p {
      color: #555;
      font-size: 14px;
      margin: 3px 0;
    }
    .card a {
      color: #1a73e8;
      text-decoration: none;
    }
    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 4px;
      margin-top: 5px;
    }
    .status-ongoing { background-color: #e6f4ea; color: #137333; }
    .status-not { background-color: #fce8e6; color: #c5221f; }
    .status-postponed { background-color: #fef7e0; color: #b06000; }
    
    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .btn-edit {
      background-color: #f39c12;
      padding: 6px 12px;
      font-size: 13px;
    }
    .btn-edit:hover {
      background-color: #d68910;
    }
    .btn-delete {
      background-color: #e74c3c;
      padding: 6px 12px;
      font-size: 13px;
    }
    .btn-delete:hover {
      background-color: #c0392b;
    }

    .no-result {
      text-align: center;
      color: #888;
      font-size: 15px;
      padding: 10px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <h2>তথ্য ব্যবস্থাপনা সফটওয়্যার</h2>
    
    <div class="section">
      <h3 id="formTitle">নতুন তথ্য যোগ করুন</h3>
      <input type="hidden" id="editIndex" value="-1">
      <input type="text" id="officeInput" placeholder="অফিস নাম...">
      <input type="text" id="userIdInput" placeholder="User ID...">
      <input type="text" id="postInput" placeholder="পদ সংখ্যা...">
      <input type="text" id="linkInput" placeholder="Link (URL)...">
      <textarea id="smsInput" placeholder="SMS Information লিখুন..."></textarea>
      
      <label class="file-upload-label">পরীক্ষার অবস্থা নির্বাচন করুন:</label>
      <select id="examStatusInput">
        <option value="পরীক্ষা হচ্ছে">পরীক্ষা হচ্ছে</option>
        <option value="পরীক্ষা হয়নি">পরীক্ষা হয়নি</option>
        <option value="পরীক্ষা স্থগিত">পরীক্ষা স্থগিত</option>
      </select>
      
      <button id="saveBtn" onclick="saveData()">গুগল শিটে সেভ করুন</button>
    </div>

    <div class="section">
      <h3>তথ্য অনুসন্ধান</h3>
      <input type="text" id="searchInput" placeholder="অফিস নাম দিয়ে সার্চ করুন..." onkeyup="searchData()">
    </div>

    <div id="resultContainer" class="result-list"></div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwABAfQbmSa6pKYt7qcOQ524q-k2j94IhBu11m2DzM1Ycs8om4Qys6-jF9cmzfQgsb0zw/exec";
    let globalDataList = [];

    window.onload = function() {
      fetchAllData();
    };

    async function fetchAllData() {
      try {
        let response = await fetch(WEB_APP_URL);
        let resultData = await response.json();
        if (resultData.status === "success") {
          globalDataList = resultData.data;
          displayResults(globalDataList);
        }
      } catch (error) {
        console.error("তথ্য লোড করতে সমস্যা:", error);
      }
    }

    async function saveData() {
      let editIndex = document.getElementById('editIndex').value;
      let officeName = document.getElementById('officeInput').value.trim();
      let userId = document.getElementById('userIdInput').value.trim();
      let postCount = document.getElementById('postInput').value.trim();
      let linkUrl = document.getElementById('linkInput').value.trim();
      let smsInfo = document.getElementById('smsInput').value.trim();
      let examStatus = document.getElementById('examStatusInput').value;

      if (officeName === "") {
        alert("দয়া করে অন্তত অফিস নাম লিখুন!");
        return;
      }

      let formData = {
        officeName: officeName,
        userId: userId || "প্রযোজ্য নয়",
        postCount: postCount || "প্রযোজ্য নয়",
        linkUrl: linkUrl || "",
        smsInfo: smsInfo || "প্রযোজ্য নয়",
        examStatus: examStatus,
        rowIndex: editIndex === "-1" ? "" : globalDataList[editIndex].rowIndex
      };

      try {
        alert("সেভ করা হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...");
        
        // ফর্ম ডেটা URL-encoded আকারে পাঠানো হচ্ছে যাতে CORS সমস্যা না হয়
        await fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify(formData)
        });

        alert("সফলভাবে সম্পন্ন হয়েছে!");
        resetForm();
        setTimeout(fetchAllData, 2000); 
      } catch (error) {
        console.error("ত্রুটি:", error);
        alert("সার্ভারে সংযোগ স্থাপন করা যায়নি।");
      }
    }

    function editData(index) {
      let item = globalDataList[index];
      document.getElementById('officeInput').value = item.officeName;
      document.getElementById('userIdInput').value = item.userId;
      document.getElementById('postInput').value = item.postCount;
      document.getElementById('linkInput').value = item.linkUrl;
      document.getElementById('smsInput').value = item.smsInfo;
      document.getElementById('examStatusInput').value = item.examStatus;
      
      document.getElementById('editIndex').value = index;
      document.getElementById('formTitle').innerText = "তথ্য এডিট করুন";
      document.getElementById('saveBtn').innerText = "আপডেট করুন";
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteData(index) {
      if (confirm("আপনি কি নিশ্চিতভাবে এই তথ্যটি মুছে ফেলতে চান?")) {
        let formData = {
          action: "delete",
          rowIndex: globalDataList[index].rowIndex
        };
        try {
          alert("মুছে ফেলা হচ্ছে, অপেক্ষা করুন...");
          await fetch(WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify(formData)
          });
          alert("তথ্যটি সফলভাবে মুছে ফেলা হয়েছে!");
          setTimeout(fetchAllData, 2000);
        } catch (error) {
          console.error("মুছে ফেলতে ত্রুটি:", error);
        }
      }
    }

    function resetForm() {
      document.getElementById('officeInput').value = "";
      document.getElementById('userIdInput').value = "";
      document.getElementById('postInput').value = "";
      document.getElementById('linkInput').value = "";
      document.getElementById('smsInput').value = "";
      document.getElementById('examStatusInput').value = "পরীক্ষা হচ্ছে";
      document.getElementById('editIndex').value = "-1";
      document.getElementById('formTitle').innerText = "নতুন তথ্য যোগ করুন";
      document.getElementById('saveBtn').innerText = "গুগল শিটে সেভ করুন";
    }

    function searchData() {
      let input = document.getElementById('searchInput').value.trim().toLowerCase();
      if (input === "") {
        displayResults(globalDataList);
        return;
      }
      let filteredResults = globalDataList.filter(item => 
        item.officeName.toLowerCase().includes(input)
      );
      displayResults(filteredResults);
    }

    function displayResults(results) {
      let container = document.getElementById('resultContainer');
      container.innerHTML = "";

      if (results && results.length > 0) {
        results.forEach((item, index) => {
          let linkHtml = item.linkUrl ? `<p><strong>Link:</strong> <a href="${item.linkUrl}" target="_blank">${item.linkUrl}</a></p>` : "";
          let statusClass = "status-ongoing";
          if (item.examStatus === "পরীক্ষা হয়নি") statusClass = "status-not";
          else if (item.examStatus === "পরীক্ষা স্থগিত") statusClass = "status-postponed";

          container.innerHTML += `
            <div class="card">
              <h3>${item.officeName}</h3>
              <p><strong>User ID:</strong> ${item.userId}</p>
              <p><strong>পদ সংখ্যা:</strong> ${item.postCount}</p>
              ${linkHtml}
              <p><strong>SMS Information:</strong> ${item.smsInfo}</p>
              <p><strong>পরীক্ষার অবস্থা:</strong> <span class="status-badge ${statusClass}">${item.examStatus}</span></p>
              <div class="action-buttons">
                <button class="btn-edit" onclick="editData(${index})">এডিট করুন</button>
                <button class="btn-delete" onclick="deleteData(${index})">ডিলিট করুন</button>
              </div>
            </div>
          `;
        });
      } else {
        container.innerHTML = `<div class="no-result">কোনো তথ্য পাওয়া যায়নি!</div>`;
      }
    }
  </script>

</body>
</html>
